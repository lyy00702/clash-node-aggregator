name: Update Clash subscription

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "sources.txt"
      - "aggregate.py"
      - "requirements.txt"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Build Clash config
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python aggregate.py --sources sources.txt --output dist/clash.yaml --limit 200
      - name: Commit generated config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/clash.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore: update generated Clash config"
          git push
